---
name: routing
reconfigureEndpoint: "/routing/settings/reconfigure" # Controller-wide reconfigure endpoint (can be overwritten)
resources:

  # A gateway object. Needed to route a whole CIDR into a point-to-point
  # interface such as an IPsec VTI: the interface itself only installs a host
  # route to its ptp peer, so a static route for anything wider has to name a
  # gateway, and a gateway is what binds a next-hop to an interface.
  - name: Gateway
    filename: gateway
    monad: gateway_item
    endpoints:
      add: "/routing/settings/addGateway"
      get: "/routing/settings/getGateway"
      update: "/routing/settings/setGateway"
      delete: "/routing/settings/delGateway"
    attrs:
      - name: Disabled
        type: string
        key: disabled
      - name: Name
        type: string
        key: name
      - name: Description
        type: string
        key: descr
      - name: Interface
        type: SelectedMap
        key: interface
      - name: IPProtocol
        type: SelectedMap
        key: ipprotocol
      - name: Gateway
        type: string
        key: gateway
      - name: DefaultGateway
        type: string
        key: defaultgw
      - name: FarGateway
        type: string
        key: fargw
      - name: MonitorDisable
        type: string
        key: monitor_disable
      - name: MonitorNoRoute
        type: string
        key: monitor_noroute
      - name: MonitorKillStates
        type: string
        key: monitor_killstates
      - name: MonitorKillStatesPriority
        type: string
        key: monitor_killstates_priority
      - name: Monitor
        type: string
        key: monitor
      - name: ForceDown
        type: string
        key: force_down
      - name: NoSync
        type: string
        key: nosync
      - name: Priority
        type: string
        key: priority
      - name: Weight
        type: string
        key: weight
      - name: LatencyLow
        type: string
        key: latencylow
      - name: LatencyHigh
        type: string
        key: latencyhigh
      - name: LossLow
        type: string
        key: losslow
      - name: LossHigh
        type: string
        key: losshigh
      - name: Interval
        type: string
        key: interval
      - name: TimePeriod
        type: string
        key: time_period
      - name: LossInterval
        type: string
        key: loss_interval
      - name: DataLength
        type: string
        key: data_length
